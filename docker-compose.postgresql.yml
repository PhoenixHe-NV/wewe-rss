version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: wewe
      POSTGRES_PASSWORD: wewe123
      POSTGRES_DB: wewe_rss
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    image: cooderl/wewe-rss:latest
    ports:
      - 4000:4000
    environment:
      - DATABASE_TYPE=postgresql
      - DATABASE_URL=postgresql://wewe:wewe123@postgres:5432/wewe_rss
      # 服务接口请求授权码
      - AUTH_CODE=123567
      # 提取全文内容模式
      # - FEED_MODE=fulltext
      # 定时更新订阅源Cron表达式
      # - CRON_EXPRESSION=35 5,17 * * *
      # 服务接口请求限制，每分钟请求次数
      # - MAX_REQUEST_PER_MINUTE=60
      # 外网访问时，需设置为服务器的公网 IP 或者域名地址
      # - SERVER_ORIGIN_URL=http://localhost:4000
    depends_on:
      - postgres

volumes:
  postgres_data: 