version: '3.8'

services:
  ai-processor:
    build:
      context: ./python
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - ALI_BAILIAN_API_KEY=${ALI_BAILIAN_API_KEY}
      - ALI_BAILIAN_API_BASE=${ALI_BAILIAN_API_BASE:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      - ALI_BAILIAN_MODEL=${ALI_BAILIAN_MODEL:-qwen-max}
      - BATCH_SIZE=${AI_BATCH_SIZE:-10}
      - MAX_RETRIES=${AI_MAX_RETRIES:-3}
      - TIMEOUT=${AI_TIMEOUT:-60}
    volumes:
      - ./python/ai_process.log:/app/ai_process.log
    command: ["--continuous", "--sleep", "300"]
