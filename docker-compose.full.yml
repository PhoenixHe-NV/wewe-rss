version: '3.9'

services:
  db:
    extends:
      file: docker-compose.yml
      service: db

  app:
    extends:
      file: docker-compose.yml
      service: app
    environment:
      - DATABASE_URL=${DATABASE_URL:-mysql://root:123456@db:3306/wewe-rss?schema=public&connect_timeout=30&pool_timeout=30&socket_timeout=30}
      - AUTH_CODE=${AUTH_CODE:-123567}

  ai-processor:
    build:
      context: ./python
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    environment:
      - DATABASE_URL=${DATABASE_URL:-mysql://root:123456@db:3306/wewe-rss?schema=public&connect_timeout=30&pool_timeout=30&socket_timeout=30}
      - ALI_BAILIAN_API_KEY=${ALI_BAILIAN_API_KEY}
      - ALI_BAILIAN_API_BASE=${ALI_BAILIAN_API_BASE:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      - ALI_BAILIAN_MODEL=${ALI_BAILIAN_MODEL:-qwen-max}
      - BATCH_SIZE=${AI_BATCH_SIZE:-10}
      - MAX_RETRIES=${AI_MAX_RETRIES:-3}
      - TIMEOUT=${AI_TIMEOUT:-60}
    volumes:
      - ./python/ai_process.log:/app/ai_process.log
    command: ["--continuous", "--sleep", "300"]

networks:
  default:
    name: wewe-rss

volumes:
  db_data:
